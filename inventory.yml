---
# VM Groups
testing_vms:
  hosts:
    vm1:
      ansible_host: xxx
      ansible_user: xxx
      ansible_password: xxx
      ansible_become: yes
      
    vm2:
      ansible_host: xxx
      ansible_user: xxx
      ansible_ssh_private_key_file: xxx to your private key file


# Variables that apply to all hosts
all:
  vars:
    ansible_connection: ssh
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    csv_file: "sample_dns_data2.csv"
    csv_output_file: "test_results2.csv"
    output_dir: "/tmp/dns_results"