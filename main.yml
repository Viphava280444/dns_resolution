---
- name: DNS Resolution Readiness Testing
  hosts: "{{ target_hosts | default('all') }}"
  become: yes
  vars:
    csv_input_file: "sample_dns_data2.csv"
    local_results_dir: "./results"
    test_results: []
    nameservers: []

  pre_tasks:
    # Create local results directory (without sudo)
    - name: Ensure local results directory exists
      delegate_to: localhost
      become: no
      file:
        path: "{{ local_results_dir }}"
        state: directory
        mode: '0755'
      run_once: true

    # Read CSV file locally
    - name: Read CSV file contents
      delegate_to: localhost
      become: no
      slurp:
        src: "{{ csv_input_file }}"
      register: csv_content
      run_once: true

    # Process CSV data locally
    - name: Parse CSV lines
      delegate_to: localhost
      become: no
      set_fact:
        csv_lines: "{{ csv_content.content | b64decode | split('\n') | reject('equalto', '') | list }}"
      run_once: true

    - name: Extract domain suffix
      delegate_to: localhost
      become: no
      set_fact:
        domain_suffix: "{{ csv_lines[0].split(',')[1] }}"
      when: csv_lines[0].startswith('Domain:')
      run_once: true

    - name: Extract nameservers
      delegate_to: localhost
      become: no
      set_fact:
        nameservers: "{{ csv_lines[1].split(',')[1] | replace('\"', '') | split(' ') }}"
      when: csv_lines[1].startswith('Nameserver')
      run_once: true

    - name: Convert remaining lines to CSV data
      delegate_to: localhost
      become: no
      set_fact:
        csv_data: "{{ csv_lines[3:] | map('split', ',') | list }}"
      when: csv_lines[2].startswith('Host')
      run_once: true
      
  tasks:
    # Process each domain entry - executed per host
    - name: Setup domain fact
      set_fact:
        host_test_results: []

    - name: Process each domain entry for host files
      include_tasks: check_host_file.yml
      loop: "{{ csv_data }}"
      loop_control:
        loop_var: domain_raw
      vars:
        domain:
          Host: "{{ domain_raw[0] }}"
          Service: "{{ domain_raw[1] }}"
          IP_Mapping: "{{ domain_raw[2] }}"
          Domain_name: "{{ domain_raw[3] }}"
          Configuration: "{{ domain_raw[4] }}"
          Description: "{{ domain_raw[5] if domain_raw | length > 5 else '' }}"
      when: domain_raw[4] == "Host file"
      
    - name: Process each domain entry for nameservers
      include_tasks: check_nameserver.yml
      loop: "{{ csv_data }}"
      loop_control:
        loop_var: domain_raw
      vars:
        domain:
          Host: "{{ domain_raw[0] }}"
          Service: "{{ domain_raw[1] }}"
          IP_Mapping: "{{ domain_raw[2] }}"
          Domain_name: "{{ domain_raw[3] }}"
          Configuration: "{{ domain_raw[4] }}"
          Description: "{{ domain_raw[5] if domain_raw | length > 5 else '' }}"
      when: domain_raw[4] == "Nameserver"

    # Get results from each host
    - name: Add host results to main results
      set_fact:
        test_results: "{{ host_test_results }}"
    
    - name: Copy results to controller
      delegate_to: localhost
      become: no
      set_fact:
        all_results: "{{ (all_results | default({})) | combine({inventory_hostname: test_results}) }}"
      run_once: false
      
    # Generate CSV results locally
    - name: Write test results to CSV on controller
      delegate_to: localhost
      become: no
      template:
        src: "templates/test_results_csv.j2"
        dest: "{{ local_results_dir }}/{{ inventory_hostname }}_test_results.csv"
        mode: '0644'
      vars:
        results: "{{ test_results }}"
        header_info:
          domain_suffix: "{{ domain_suffix }}"
          nameservers: "{{ nameservers | join(' ') }}"