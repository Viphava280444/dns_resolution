---
- name: DNS Resolution Readiness Testing
  hosts: "{{ target_hosts | default('all') }}"
  become: yes
  vars:
    dns_results_dir: "/tmp/dns_results"
    csv_input_file: "sample_dns_data2.csv"
    csv_output_file_name: "test_results2.csv"
    local_results_dir: "./results"
    test_results: []

  pre_tasks:
    # Create local results directory first (without sudo)
    - name: Ensure local results directory exists
      delegate_to: localhost
      become: no
      file:
        path: "{{ local_results_dir }}"
        state: directory
        mode: '0755'
      run_once: true

    # Create output directory on target hosts
    - name: Ensure output directory exists on target
      file:
        path: "{{ dns_results_dir }}"
        state: directory
        mode: '0755'
      
    # Copy required files to target hosts
    - name: Copy CSV data file to target hosts
      copy:
        src: "{{ csv_input_file }}"
        dest: "{{ dns_results_dir }}/{{ csv_input_file | basename }}"
        mode: '0644'
      
    - name: Copy templates directory
      copy:
        src: templates/
        dest: "{{ dns_results_dir }}/templates/"
        mode: '0644'
        
  tasks:
    - name: Read entire CSV file as lines
      ansible.builtin.slurp:
        src: "{{ dns_results_dir }}/{{ csv_input_file | basename }}"
      register: csv_content

    - name: Parse CSV lines
      set_fact:
        csv_lines: "{{ csv_content.content | b64decode | split('\n') | reject('equalto', '') | list }}"

    - name: Extract domain suffix
      set_fact:
        domain_suffix: "{{ csv_lines[0].split(',')[1] }}"
      when: csv_lines[0].startswith('Domain:')

    - name: Extract nameservers
      set_fact:
        # Remove quotes and split on comma+space
        nameservers: "{{ csv_lines[1].split(',')[1] | replace('\"', '') | split(', ') }}"
      when: csv_lines[1].startswith('Nameserver')

    - name: Convert remaining lines to CSV data
      set_fact:
        csv_data: "{{ csv_lines[3:] | map('split', ',') | list }}"
      when: csv_lines[2].startswith('Host')

    - name: Process each domain entry
      include_tasks: dns_resolution.yml
      loop: "{{ csv_data }}"
      loop_control:
        loop_var: domain_entry_raw
      vars:
        domain_entry: >-
          {{
            {
              'Host': domain_entry_raw[0],
              'Service': domain_entry_raw[1],
              'IP_Mapping': domain_entry_raw[2],
              'Domain_name': domain_entry_raw[3],
              'Configuration': domain_entry_raw[4],
              'Description': domain_entry_raw[5] if domain_entry_raw | length > 5 else ''
            }
          }}
      when: domain_entry.Domain_name is defined and domain_entry.Domain_name != "" and domain_entry.Configuration in ["Host file", "Nameserver"]

    - name: Display test results summary
      debug:
        msg: "{{ test_results }}"

    - name: Write test results to CSV on target
      ansible.builtin.template:
        src: "templates/test_results_csv.j2"  # Changed: Use local path
        dest: "{{ dns_results_dir }}/{{ inventory_hostname }}_{{ csv_output_file_name }}"
        mode: '0644'
      vars:
        results: "{{ test_results }}"
        header_info:
          domain_suffix: "{{ domain_suffix }}"
          nameservers: "{{ nameservers | join(', ') }}"
          
    - name: Fetch results back to control node
      fetch:
        src: "{{ dns_results_dir }}/{{ inventory_hostname }}_{{ csv_output_file_name }}"
        dest: "{{ local_results_dir }}/"
        flat: yes